<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달님에게 소원을 — 라이트 테스트 v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --night:#181233; --night-2:#241c47; --moon:#F5D67B; --moon-soft:#F8E3A3; --ink:#3a2f1f; --coral:#E15B4D; --sage:#8FBFA8; --star:#fff; }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; background:radial-gradient(ellipse at 50% -10%, var(--night-2), var(--night) 60%); color:#efe6d2; font-family:'Noto Sans KR',sans-serif; min-height:100vh; overflow-x:hidden; }
  .stage{ position:relative; max-width:520px; margin:0 auto; min-height:100vh; padding:28px 20px 60px; display:flex; flex-direction:column; align-items:center; }
  .stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .stars span{ position:absolute; background:var(--star); border-radius:50%; opacity:.55; animation:twinkle 3.5s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.2;} 50%{opacity:.85;} }
  .moon-glow{ position:absolute; top:-60px; left:50%; transform:translateX(-50%); width:220px; height:220px; border-radius:50%; background:radial-gradient(circle at 35% 32%, var(--moon-soft), var(--moon) 55%, #e8be5c 100%); box-shadow:0 0 90px 20px rgba(245,214,123,0.25); z-index:0; }
  header.top{ position:relative; z-index:1; text-align:center; margin-bottom:6px; padding-top:110px; }
  .eyebrow{ font-size:11px; letter-spacing:.14em; color:var(--sage); text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  h1.title{ font-family:'Black Han Sans',sans-serif; font-size:26px; line-height:1.2; margin:0 0 6px; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.35); }
  .sub{ font-size:12.5px; color:#cfc4a8; margin:0; line-height:1.6; }
  .panel{ position:relative; z-index:1; width:100%; margin-top:24px; }
  .card{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:22px; }
  .step-label{ font-size:12px; font-weight:700; color:var(--moon); letter-spacing:.06em; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .step-label .num{ width:20px; height:20px; border-radius:50%; background:var(--coral); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; font-family:'Black Han Sans',sans-serif; }
  .chip-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .chip{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:14px; padding:13px 4px; text-align:center; cursor:pointer; transition:all .18s ease; color:#f1e9d4; font-weight:500; font-size:13px; }
  .chip:hover{ background:rgba(255,255,255,0.1); transform:translateY(-2px); }
  .chip.selected{ background:linear-gradient(135deg, var(--coral), #c8493c); border-color:transparent; color:#fff; box-shadow:0 6px 18px rgba(225,91,77,0.35); }
  textarea#wishText{ width:100%; min-height:90px; margin-top:14px; border-radius:14px; border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.18); color:#fff; padding:14px; font-family:'Noto Sans KR',sans-serif; font-size:14px; line-height:1.6; resize:none; }
  textarea#wishText::placeholder{ color:#8f87a8; }
  .input-error{ color:var(--coral); font-size:12px; margin:8px 2px 0; font-weight:700; }
  .btn{ appearance:none; border:none; cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:14.5px; border-radius:999px; padding:13px 22px; transition:transform .12s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--moon); color:#3a2f0f; box-shadow:0 6px 16px rgba(245,214,123,0.3); }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background:transparent; color:#efe6d2; border:1px solid rgba(255,255,255,0.25); }
  .btn-row{ display:flex; justify-content:center; margin-top:16px; gap:10px; }
  .fade-el{ display:none; flex-direction:column; align-items:center; }
  .fade-el.show{ display:flex; animation:fadeUp .4s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .letter-card{ width:100%; border-radius:18px; padding:24px 22px; background:linear-gradient(160deg,#efe0b8,#ddc788); color:var(--ink); box-shadow:0 12px 30px rgba(0,0,0,.4); }
  .letter-card .from{ font-size:11px; letter-spacing:.08em; color:#8a6a25; font-weight:700; margin-bottom:10px; }
  .letter-card .body{ font-size:14.5px; line-height:1.85; color:#4a3a20; white-space:pre-line; }
  .places{ width:100%; margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .place{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:13px 16px; display:flex; align-items:center; gap:12px; min-height:118px; }
  .place .moon-mini{ font-size:20px; flex-shrink:0; }
  .place .txt{ flex:1; min-width:0; }
  .place .catch{ font-size:12px; white-space:normal; overflow:visible; color:var(--moon-soft); font-weight:600; margin-top:5px; line-height:1.45; display:block; word-break:keep-all; overflow-wrap:break-word; }
  .place .region-tag{ font-size:10.5px; color:var(--sage); font-weight:700; margin-bottom:1px; }
  .place h3{ margin:0; font-size:15.5px; color:#fff; }
  .places-label{ font-size:12.5px; color:var(--moon-soft); font-weight:700; margin:4px 0 2px; text-align:center; }
  .again-hint{ font-size:12px; color:#a89a75; margin-top:16px; text-align:center; line-height:1.6; }
  .footnote{ margin-top:26px; text-align:center; font-size:10.5px; color:#7a7196; line-height:1.7; }
  .safety-card{ width:100%; border-radius:18px; padding:22px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); text-align:center; }
  .safety-card p{ font-size:13.5px; line-height:1.8; color:#efe6d2; }
  #debugPanel{ display:none; position:fixed; right:0; top:0; bottom:0; width:320px; max-width:92vw; background:rgba(10,8,24,0.97); color:#d8f0e2; z-index:999; padding:16px; overflow-y:auto; font-size:11px; line-height:1.5; border-left:1px solid rgba(255,255,255,0.12); font-family:'Menlo','Consolas',monospace; }
  #debugPanel.show{ display:block; }
  #debugPanel h3{ font-size:12px; color:var(--moon); margin:14px 0 6px; text-transform:uppercase; }
  #debugPanel .drow{ padding:5px 7px; margin-bottom:4px; border-radius:7px; background:rgba(255,255,255,0.04); }
  #debugToggleHint{ position:fixed; left:8px; bottom:8px; font-size:9px; color:#3a3550; z-index:998; }
  @media (max-width:380px){ h1.title{ font-size:21px; } }
</style>
</head>
<body>

<div class="stars" id="starField"></div>
<div class="stage">
  <div class="moon-glow"></div>
  <header class="top">
    <div class="eyebrow">100X100 · FULL DB · Gemini 3.6 Flash</div>
    <h1 class="title">달님에게 소원을</h1>
    <p class="sub">실제 100X100 선정 명소 전체에서 <b>Gemini 3.6 Flash</b>가<br>소원에 어울리는 명소 3곳을 고릅니다.</p>
  </header>

  <div class="panel" id="panelInput">
    <div class="card">
      <div class="step-label"><span class="num">1</span> 어떤 소원인가요?</div>
      <div class="chip-grid" id="chipGrid"></div>
      <div class="step-label" style="margin-top:18px;"><span class="num">2</span> 달님에게 전할 소원을 적어주세요</div>
      <textarea id="wishText" placeholder="예: 원하는 회사에 취업하고 싶어요"></textarea>
      <p class="input-error" id="inputError" style="display:none;">내용을 다시 입력해주세요.</p>
      <div class="btn-row"><button class="btn btn-primary" id="submitBtn" disabled>달에게 소원 전하기 →</button></div>
    </div>
  </div>

  <div class="panel" id="panelLetter" style="display:none;">
    <div class="card">
      <div class="fade-el show" id="letterWrap">
        <div class="letter-card">
          <div class="from">FROM. 달님</div>
          <div class="body" id="letterBody"></div>
        </div>
        <div class="btn-row"><button class="btn btn-primary" id="openLetterBtn">편지 넘겨서 명소 보기 →</button></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panelResult" style="display:none;">
    <div class="card">
      <div class="fade-el show" id="resultWrap"></div>
    </div>
  </div>

  <p class="footnote">이 화면은 매칭 로직 방향성 검증을 위한 <b>라이트 테스트 프로토타입</b>입니다.</p>
</div>

<div id="debugPanel"></div>
<div id="debugToggleHint">debug: ?debug=1 or Ctrl+Shift+D</div>

<script>
const API_PROVIDER = 'gemini';

// =====================================================================
// 100X100 소원매칭 — 라이트 테스트 v4 · 상황분석
// - 명소별 고유 캐치프레이즈 (역할 공용 카피 재사용 X)
// - 재물·자산 세부 의도별 역할 분리 (주식전망/청약명당/행운스팟/재물체험/안정절제)
// - "달의 답장" 2단계 노출 (편지 먼저 → 넘기면 명소 3곳)
// =====================================================================

  }

}

const GRIEF_STRONG = ['돌아가신', '하늘나라', '기일', '제사'];
const FAMILY_WORDS = ['아버지', '어머니', '엄마', '아빠', '할머니', '할아버지'];
const CRISIS_KEYWORDS = ['사라지고 싶', '죽고 싶', '그만 살고', '살기 싫', '자살', '목숨을 끊'];

function includesAny(text, arr) { return arr.some((k) => text.includes(k)); }
function isCrisis(wish) { return includesAny(wish, CRISIS_KEYWORDS); }
function isGrief(wish) {
  if (includesAny(wish, GRIEF_STRONG)) return true;
  if (wish.includes('꿈에') && includesAny(wish, FAMILY_WORDS) && (wish.includes('나오') || wish.includes('보고'))) return true;
  return false;
}
function isNegative(wish) { return includesAny(wish, NEGATIVE_KEYWORDS); }

function isMeaninglessInput(text) {
  const trimmed = text.trim();
  if (trimmed.length < 2) return true;
  const meaningfulChars = (trimmed.match(/[가-힣a-zA-Z0-9]/g) || []).length;
  const totalChars = trimmed.replace(/\s/g, '').length;
  if (totalChars === 0) return true;
  return meaningfulChars / totalChars < 0.5;
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickDistinct(pool, n) {
  const copy = [...pool];
  const out = [];
  while (out.length < n && copy.length > 0) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(idx, 1)[0]);
  }
  return out;
}

function normalizeKo(text) {
  return text
    .toLowerCase()
    .replace(/[~!@#$%^&*()_+\-=\[\]{};:'",.<>/?\\|`]/g, '')
    .replace(/\s+/g, '');
}
function rx(text, pattern) { return pattern.test(normalizeKo(text)); }

  // C. 현재 함께하는 연인/배우자와 관계를 오래 유지하고 싶은 소원.
  if (
    /(남자친구|여자친구|남친|여친|애인|연인|배우자|남편|아내|사랑하는사람)/.test(w) &&
    /(오래|계속|행복|안싸우|싸우지|별탈없이|무탈|잘지내|평생|함께)/.test(w)
  ) {
    Object.assign(A,{
      subject:'현재 연인·배우자', situation:'이미 이어지고 있는 관계',
      desiredChange:'관계 지속·평안·좋은 미래', mood:'애정과 바람',
      preferredRoles:['현재연애지속','마음안정'],
      avoidRoles:['인연커뮤니티','로맨틱만남','이별회복','자기계발꾸미기'],
      confidence:.99, scenario:'existing_love',
      letter:'이미 곁에 소중한 사람이 있구나.\n지금 나누고 있는 마음이 익숙함 속에서도 오래 따뜻하게 이어지길 바라.\n둘이 함께 좋은 시간을 더 쌓아갈 수 있는 곳들을 찾아봤어.'
    });
    return A;
  }

  // D. 짝사랑/고백/상대의 호감을 바라는 관계 진전형.
  if (/(짝사랑|고백|나를좋아|날좋아|마음이통|사귀고싶|이뤄지지않|이루어지지않|잘되고싶)/.test(w)) {
    Object.assign(A,{
      subject:'마음에 둔 상대', situation:'짝사랑·고백 전 관계',
      desiredChange:'상호 호감·관계 진전', mood:'설렘과 간절함',
      preferredRoles:['로맨틱만남','인연커뮤니티','운동체력'],
      avoidRoles:['이별회복','현재연애지속'],
      confidence:.96, scenario:'unrequited',
      letter:'마음속에 오래 품어온 사람이 있구나.\n이번에는 바라보기만 하지 말고 한 걸음 가까워질 수 있도록 달님도 용기를 조금 보태줄게.\n둘 사이에 자연스러운 대화와 설렘을 더해줄 곳들을 찾아봤어.'
    });
    return A;
  }

  // E. 키/신체 성장: 한국어 어미와 띄어쓰기 변형까지 정규화해서 감지.
  if (/(키.*(크|컸|커지|쑥쑥)|쑥쑥.*(자라|컸|크)|키좀)/.test(w)) {
    Object.assign(A,{
      subject:'본인·아이', situation:'신체 성장 희망',
      desiredChange:'건강한 성장', mood:'기대',
      preferredRoles:['건강식','가벼운활동','자연치유'],
      avoidRoles:['운동체력'], // 래프팅·패러글라이딩 같은 고강도 후보 차단
      confidence:.96, scenario:'height_growth',
      letter:'오늘보다 내일 한 뼘 더, 건강하게 쑥쑥 자라길 바라는 마음이구나.\n잘 먹고 가볍게 몸을 움직이며 튼튼한 하루를 쌓아가보자.\n달님도 건강한 성장을 함께 응원할게.'
    });
    return A;
  }

  // F. 체력 강화: 운동 2 + 건강식 1이 자연스럽게 섞이도록.
  if (/(체력|기초체력|지구력|튼튼|근육).*(좋|늘|키우|강해)|체력좋|체력늘/.test(w)) {
    Object.assign(A,{
      situation:'체력 강화', desiredChange:'활력과 체력 증진',
      preferredRoles:['운동체력','건강식','가벼운활동'],
      avoidRoles:[], confidence:.94, scenario:'fitness',
      letter:'하고 싶은 걸 체력 때문에 미루지 않도록 몸에 힘을 차근차근 채워보자.\n잘 움직이고 잘 먹는 하루가 쌓이면 분명 지금보다 더 단단해질 거야.'
    });
    return A;
  }

  // G. 임금/연봉/성과급/부자/갑부 등 재물 상승형.
  if (/(월급|연봉|성과급|보너스|봉급|돈|재산|자산|부자|갑부|재벌|금은보화|돈벼락|수입).*(오르|올라|많|받|벌|생기|되|늘)|부자되|갑부되|돈많/.test(w)) {
    Object.assign(A,{
      situation:'재물·소득 상승 희망', desiredChange:'수입 증가·풍요',
      preferredRoles:['재물체험','주식전망','안정절제'],
      avoidRoles:['학업몰입'], confidence:.95, scenario:'wealth_up',
      letter:'바라는 숫자가 꽤 시원하게 올라가길 기다리고 있구나.\n이번에는 좋은 기운도 챙기고, 조금은 웃을 수 있는 곳들로 골라봤어.\n통장에도 반가운 변화가 찾아오길!'
    });
    return A;
  }

  // H. 주식·투자.
  if (/(주식|증시|차트|상한가|우상향|투자)/.test(w)) {
    Object.assign(A,{
      situation:'투자 결과 상승 기대', desiredChange:'수익·상승',
      preferredRoles:['주식전망','재물체험','기원'],
      avoidRoles:['안정절제'], confidence:.97, scenario:'stocks',
      letter:'차트를 볼 때마다 마음도 같이 오르락내리락했겠구나.\n이번에는 네가 기다리는 초록불이 길게 이어지길 달님도 같이 빌어볼게.'
    });
    return A;
  }

  // I. 기본 역할 점수: 명확한 상황이 없을 때만 사용.
  const roles = CATEGORY_ROLES[category] || [];
  const scored = roles.map(role => ({
    role,
    score:(ROLE_KEYWORDS[role]||[]).filter(k => w.includes(normalizeKo(k))).length
  })).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);

  if (scored.length) {
    A.preferredRoles = scored.slice(0,2).map(x=>x.role);
    A.confidence = .68;
    A.scenario = 'keyword_general';
  } else {
    // J. 애매하면 추측하지 않고 기원/일출 + 마음안정으로 안전 폴백.
    A.preferredRoles = ['기원','마음안정'];
    A.confidence = .30;
    A.scenario = 'safe_fallback';
    A.letter = '소원의 뜻을 한 가지로 단정하기보다는, 마음을 차분히 담아 빌 수 있는 곳들을 찾아봤어.\n떠오르는 해와 고요한 풍경 앞에서 네 소원을 다시 한번 마음속에 담아봐.';
  }
  return A;
}

function poolForRole(role) {
  // 고백설렘은 실제 DB에 양조장/브루어리/와이너리가 있으면 우선 포함하도록 확장 가능.
  if (role === '인연커뮤니티') {
    return CANDIDATES.filter(c => c.role === role ||
      /양조장|브루어리|와이너리|전통주|양조/.test(c['명소명'] + c['원본설명']));
  }
  return CANDIDATES.filter(c=>c.role===role);
}

function candidateAllowed(c, analysis) {
  return !analysis.avoidRoles.includes(c.role);
}

function pickScenarioPlaces(analysis, n=3) {
  const picks=[];
  const seen=new Set();

  // 역할 순서를 유지하면서 역할별 1개씩 먼저 뽑아 다양성을 확보.
  for (const role of analysis.preferredRoles) {
    const pool=poolForRole(role).filter(c=>candidateAllowed(c,analysis) && !seen.has(c['명소명']));
    if (pool.length) {
      const p=pickRandom(pool);
      picks.push(p); seen.add(p['명소명']);
      if (picks.length>=n) return picks;
    }
  }

  // 부족하면 같은 선호 역할의 나머지 후보.
  const extra=analysis.preferredRoles
    .flatMap(poolForRole)
    .filter(c=>candidateAllowed(c,analysis) && !seen.has(c['명소명']));
  for (const p of pickDistinct(extra,n-picks.length)) {
    picks.push(p);seen.add(p['명소명']);
  }

  // 그래도 부족하면 '기원'을 우선 사용. 억지 역할로 채우지 않음.
  if (picks.length<n) {
    const prayer=CANDIDATES.filter(c=>c.role==='기원' && !seen.has(c['명소명']));
    for (const p of pickDistinct(prayer,n-picks.length)) {
      picks.push(p);seen.add(p['명소명']);
    }
  }
  return picks.slice(0,n);
}

function personalizedCatch(c, A) {
  const n=c['명소명'];

  if (A.scenario==='prenatal') {
    if (n.includes('트리비움')) return '요가와 명상으로 호흡을 고르며, 아이를 맞이할 몸과 마음을 차분히 준비해보세요.';
    if (c.role==='기원') return '새로운 가족을 기다리는 마음을 담아, 엄마와 아이 모두의 평안을 조용히 빌어보세요.';
    return '무리하지 않고 천천히 쉬어가며, 아이를 기다리는 마음에 편안한 여백을 만들어보세요.';
  }
  if (A.scenario==='payroll') {
    if (c.role==='기원') return '직원들에게 해야 할 몫을 무사히 지켜낼 수 있기를, 잠시 마음을 가다듬고 빌어보세요.';
    return '책임감과 걱정이 큰 마음을 잠시 내려놓고, 다시 차분하게 다음 선택을 생각해보세요.';
  }
  if (A.scenario==='existing_love') {
    return '새로운 인연을 찾기보다, 지금 곁에 있는 사람과 천천히 좋은 시간을 더 쌓아보세요.';
  }
  if (A.scenario==='unrequited') {
    if (/양조장|브루어리|와이너리|전통주|양조/.test(n+c['원본설명']))
      return '달달한 한 잔에 용기를 살짝 빌려, 평소 못했던 마음을 자연스럽게 건네보세요.';
    if (c.role==='운동체력')
      return '함께 웃고 두근거릴 만한 체험으로 어색했던 거리부터 조금 가까워져 보세요.';
    return '좋은 분위기 속에서 대화를 나누며, 마음을 전할 타이밍을 천천히 만들어보세요.';
  }
  if (A.scenario==='height_growth') {
    if (c.role==='건강식') return '쑥쑥 자라려면 잘 먹는 것도 중요하죠. 든든하고 건강한 한 끼로 튼튼한 하루를 채워보세요.';
    return '잘 먹고 가볍게 움직이는 하루를 쌓으며 건강하게 자랄 힘을 차근차근 채워보세요.';
  }
  if (A.scenario==='fitness') {
    if (c.role==='건강식') return '잘 움직이는 것만큼 잘 먹는 것도 중요하니까요. 든든한 한 끼로 체력을 채워보세요.';
    return '자연 속에서 몸을 움직이며 체력을 차근차근 끌어올려보세요.';
  }
  if (A.scenario==='wealth_up') {
    if (c.role==='주식전망') return '이번엔 물가 말고 내 수입이 오를 차례! 높은 곳에서 상승 기운부터 챙겨가세요.';
    if (c.role==='재물체험') return '금은보화가 어디 숨어 있을지 모르니까요. 오늘은 진짜 귀한 것부터 찾아보세요.';
    if (c.role==='안정절제') return '부자가 되고 싶다고요? 잠시 욕심은 내려놓고 마음만큼은 누구보다 넉넉하게 채워보세요.';
  }
  if (A.scenario==='stocks') {
    if (c.role==='주식전망') return '끝없이 펼쳐지는 전망처럼 내 차트도 시원하게 우상향하길! 높은 곳에서 좋은 기운부터 챙겨가세요.';
  }
  return c.catch;
}

function letterForAnalysis(A) {
  if (A.letter) return A.letter;
  if (A.preferredRoles[0] && LETTER_ROLE_OVERRIDE[A.preferredRoles[0]]) return LETTER_ROLE_OVERRIDE[A.preferredRoles[0]];
  return LETTER_DEFAULT[A.category];
}

function buildRecommendation(category, wishRaw) {
  const wish = wishRaw.trim();
  if (isCrisis(wish)) return { type:'crisis' };
  if (isGrief(wish)) {
    const pool=CANDIDATES.filter(c=>c.role==='그리움추모');
    return {type:'gentle',role:'그리움추모',picks:pickDistinct(pool,3),letter:GENTLE_LETTER};
  }
  if (isNegative(wish)) {
    const pool=[...NEGATIVE_ROLE_PLACES.마음정화(),...NEGATIVE_ROLE_PLACES.도파민체험()];
    return {type:'normal',role:'mixed',picks:pickDistinct(pool,3),plan:[{role:'마음정화'},{role:'도파민체험'}],letter:NEGATIVE_LETTER,analysis:{scenario:'negative'}};
  }

  const analysis=analyzeWishFree(category,wish);
  const picks=pickScenarioPlaces(analysis,3).map(c=>({...c,catch:personalizedCatch(c,analysis)}));
  return {
    type:'normal',
    analysis,
    plan:analysis.preferredRoles.map(role=>({role,count:1})),
    detected:analysis.preferredRoles.map(role=>({role,score:analysis.confidence})),
    fallback:analysis.scenario==='safe_fallback',
    picks,
    letter:letterForAnalysis(analysis)
  };
}

let selectedCategory = null;
let lastResult = null;

const chipGrid = document.getElementById('chipGrid');
CATEGORIES.forEach((cat) => {
  const el = document.createElement('div');
  el.className = 'chip';
  el.textContent = cat;
  el.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedCategory = cat;
    checkReady();
  });
  chipGrid.appendChild(el);
});

const wishText = document.getElementById('wishText');
const submitBtn = document.getElementById('submitBtn');
const inputError = document.getElementById('inputError');
wishText.addEventListener('input', () => { checkReady(); inputError.style.display = 'none'; });
function checkReady() { submitBtn.disabled = !(selectedCategory && wishText.value.trim().length > 0); }

submitBtn.addEventListener('click', async () => {
  if (isMeaninglessInput(wishText.value)) { inputError.style.display = 'block'; return; }
  inputError.style.display = 'none';
  const wish = wishText.value.trim();
  submitBtn.disabled = true;
  const old = submitBtn.textContent;
  submitBtn.textContent = '달님이 소원을 읽는 중…';
  inputError.style.color = '';
  const loadingTimers = [
    setTimeout(()=>{ submitBtn.textContent='어울리는 명소를 찾는 중…'; }, 1300),
    setTimeout(()=>{ submitBtn.textContent='달님이 답장을 고르는 중…'; }, 2800)
  ];
  try {
    const resp = await fetch('/api/recommend', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:selectedCategory,wish})});
    const payload = await resp.json();
    if(!resp.ok) throw new Error(payload?.error || 'API 요청 실패');
    const result={type:'normal',picks:(payload.picks||[]).slice(0,3),letter:payload.letter,analysis:payload.analysis||{},provider:API_PROVIDER};
    lastResult={category:selectedCategory,wish,result};
    document.getElementById('panelInput').style.display='none';
    document.getElementById('letterBody').textContent=result.letter;
    document.getElementById('panelLetter').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  } catch(err) {
    inputError.textContent = '달님이 잠깐 길을 잃었어. 한 번만 다시 불러줘!';
    inputError.style.color = '#F8E3A3';
    inputError.style.display='block';
  } finally {
    loadingTimers.forEach(clearTimeout);
    submitBtn.disabled=false;
    submitBtn.textContent=old;
  }
});

document.getElementById('openLetterBtn').addEventListener('click', () => {
  document.getElementById('panelLetter').style.display = 'none';
  renderResult(lastResult.result);
  document.getElementById('panelResult').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function renderResult(result) {
  const wrap = document.getElementById('resultWrap');
  if (result.type === 'crisis') {
    wrap.innerHTML = `
      <div class="safety-card">
        <p>지금 많이 힘드신 것 같아요.<br>혼자 견디지 않으셔도 괜찮아요.<br><br>
        마음이 힘들 때는 <b>1393(자살예방상담전화)</b> 또는 <b>129(보건복지상담센터)</b>로<br>
        전화하시면 도움을 받으실 수 있어요.</p>
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="restartBtn">처음으로 돌아가기 →</button></div>
    `;
    bindRestart();
    return;
  }

  let placesHtml = '';
  result.picks.slice(0,3).forEach((c) => {
    placesHtml += `
      <div class="place">
        <div class="moon-mini">🌕</div>
        <div class="txt">
          <h3>${c['명소명']}</h3>
          <div class="catch">${c.catch}</div>
        </div>
      </div>`;
  });

  wrap.innerHTML = `
    <div class="headline" style="font-size:14px;color:#F8E3A3;text-align:center;margin-bottom:6px;font-weight:700;">보름달이 당신의 소원에<br>어울리는 행선지를 찾았어요</div>
    <div class="places-label">달이 골라온 3곳이에요</div>
    <div class="places">${placesHtml}</div>
    <div class="again-hint">다른 소원도 몇 번이든 다시 빌어볼 수 있어요.</div>
    <div class="btn-row"><button class="btn btn-ghost" id="restartBtn">다시 소원 빌기 →</button></div>
  `;
  bindRestart();
}

function bindRestart() {
  document.getElementById('restartBtn').addEventListener('click', () => {
    // 테스트 편의를 위해 카테고리 선택은 유지하고, 소원 내용만 초기화
    wishText.value = '';
    inputError.style.display = 'none';
    checkReady();
    document.getElementById('panelResult').style.display = 'none';
    document.getElementById('panelLetter').style.display = 'none';
    document.getElementById('panelInput').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

// ---------------------------------------------------------------------
// 디버그 패널
// ---------------------------------------------------------------------

function isDevMode() {
  return new URLSearchParams(location.search).get('debug') === '1' || document.body.dataset.dev === '1';
}

function renderDebugPanel(last) {
  const panel = document.getElementById('debugPanel');
  if (!isDevMode() || !last) { panel.classList.remove('show'); return; }
  const { category, wish, result } = last;

  let extra = '';
  if (result.type === 'crisis') {
    extra = '<div class="drow">위기 신호 감지 → 명소 추천 대신 안내 문구 표시</div>';
  } else if (result.type === 'gentle') {
    extra = '<div class="drow">그리움/추모 신호 감지 → 톤 전환(담백체), 그리움추모 역할 전용, 편지도 gentle 버전</div>';
  } else {
    const detected = result.detected && result.detected.length
      ? result.detected.map((d) => `${d.role}(${d.score})`).join(', ')
      : '없음';
    extra = `
      <div class="drow">감지된 역할: ${detected}</div>
      <div class="drow">폴백 사용 여부: ${result.fallback ? 'YES (안전 폴백)' : 'NO'}</div>
      <div class="drow">상황 시나리오: ${result.analysis ? result.analysis.scenario : '-'}</div>
      <div class="drow">대상: ${result.analysis ? result.analysis.subject : '-'}</div>
      <div class="drow">상황: ${result.analysis ? result.analysis.situation : '-'}</div>
      <div class="drow">바라는 변화: ${result.analysis ? result.analysis.desiredChange : '-'}</div>
      <div class="drow">추천 금지 역할: ${result.analysis ? result.analysis.avoidRoles.join(', ') || '없음' : '-'}</div>
      <div class="drow">분석 확신도: ${result.analysis ? result.analysis.confidence : '-'}</div>
      <div class="drow">역할 배분: ${(result.plan || []).map((p) => `${p.role}${p.count ? ' x' + p.count : ''}`).join(' + ')}</div>
    `;
  }

  panel.innerHTML = `
    <h3>이번 요청</h3>
    <div class="drow">카테고리: <b style="color:#fff">${category}</b></div>
    <div class="drow">소원 원문: "${wish}"</div>
    <h3>매칭 결과</h3>
    ${extra}
  `;
  panel.classList.add('show');
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') {
    document.body.dataset.dev = document.body.dataset.dev === '1' ? '0' : '1';
    document.getElementById('debugPanel').classList.toggle('show', isDevMode() && !!lastResult);
    if (isDevMode() && lastResult) renderDebugPanel(lastResult);
  }
});

// 별빛 배경
const starField = document.getElementById('starField');
for (let i = 0; i < 50; i++) {
  const s = document.createElement('span');
  const size = Math.random() * 2 + 1;
  s.style.width = size + 'px'; s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 70 + '%';
  s.style.animationDelay = Math.random() * 3 + 's';
  starField.appendChild(s);
}

</script>
